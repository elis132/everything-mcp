name: Live smoke test
on:
  workflow_dispatch:
jobs:
  live-smoke:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install independent MCP
        run: pip install -e .
      - name: Exercise actual MCP protocol
        run: python tests/live_smoke.py
