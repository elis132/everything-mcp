name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Resolves the supported mcp 1.x range from package metadata.
  # Job names here are pinned as required status checks, so keep the matrix
  # dimensions stable - adding one renames every job and the required checks
  # then never report.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Show resolved mcp version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Test
        run: pytest -v

  # Keep the existing required job name stable while validating the supported SDK line.
  test-mcp1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with mcp 1.x
        run: |
          pip install -e ".[dev]"
          pip install "mcp<2.0.0"
      - name: Show resolved mcp version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Test
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/ scripts/
      - name: Ruff format
        run: ruff format --check src/ tests/ scripts/
